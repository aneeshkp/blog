apiVersion: batch.llm-d.ai/v1alpha1
kind: LLMBatchGateway
metadata:
  name: invalid-both-transports
  namespace: default
spec:
  secretRef:
    name: batch-gateway-secrets
  fileStorage:
    s3:
      bucket: example-bucket
  apiServer: {}
  processor:
    asyncConfig:
      resultPollTimeout: 30s
      redis: {}
      sql: {}
  gc: {}
