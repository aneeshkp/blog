<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">llm-d Batch Gateway operator-managed architecture</title>
  <desc id="desc">RHOAI and AI Gateway operators install the Batch Gateway Operator. A separate user-created LLMBatchGateway resource causes it to reconcile API, processor, async processor, and garbage-collector workloads. PostgreSQL stores job metadata and the batch-job queue; S3-compatible or filesystem storage holds file bytes; a separate Redis or Valkey or experimental SQL transport carries async requests and results to the existing model-serving route.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1670c5"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c9190b"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6842c2"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#238636"/></marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#68717d"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#182230}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#4b5563}.sect{font-size:18px;font-weight:700}.nt{font-size:16px;font-weight:700}.compact{font-size:14px}.ns{font-size:12px;fill:#4b5563}.sm{font-size:13px;fill:#374151}.tiny{font-size:12px;fill:#4b5563}.lab{font-size:12px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.card{fill:#fff;stroke:#aeb7c2;stroke-width:1.4;rx:9}.red{fill:none;stroke:#c9190b;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#ar)}.blue{fill:none;stroke:#1670c5;stroke-width:2.4;marker-end:url(#ab)}.purple{fill:none;stroke:#6842c2;stroke-width:2.6;marker-end:url(#ap)}.green{fill:none;stroke:#238636;stroke-width:2.6;marker-end:url(#ag)}.gray{fill:none;stroke:#68717d;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#ax)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text class="title" x="36" y="42">llm-d Batch Gateway: operator-managed architecture</text>
  <text class="sub" x="36" y="70">A declarative batch layer reuses the existing llm-d model-serving path.</text>
  <g aria-label="Flow legend">
    <path class="red" d="M38 101h30"/><text class="tiny" x="77" y="105">reconcile / ownership</text>
    <path class="blue" d="M250 101h30"/><text class="tiny" x="289" y="105">API and inference data</text>
    <path class="purple" d="M474 101h30"/><text class="tiny" x="513" y="105">request dispatch</text>
    <path class="green" d="M646 101h30"/><text class="tiny" x="685" y="105">results</text>
    <path class="gray" d="M770 101h30"/><text class="tiny" x="809" y="105">expiry cleanup</text>
  </g>

  <rect x="24" y="123" width="1552" height="190" rx="14" fill="#fff7f6" stroke="#e7b6b1"/>
  <text class="sect" x="42" y="150">Control plane · enabling the operator is separate from creating a workload</text>
  <g text-anchor="middle">
    <rect class="card" x="38" y="170" width="170" height="68"/><text class="nt compact" x="123" y="198">DataScienceCluster</text><text class="ns" x="123" y="219">aigateway: Managed</text>
    <rect class="card" x="235" y="170" width="180" height="68"/><text class="nt" x="325" y="198">RHOAI Operator</text><text class="ns" x="325" y="219">creates AIGateway CR</text>
    <rect class="card" x="443" y="170" width="172" height="68"/><text class="nt" x="529" y="198">AIGateway CR</text><text class="ns" x="529" y="219">batchGateway: Managed</text>
    <rect class="card" x="643" y="170" width="210" height="68"/><text class="nt" x="748" y="198">AI Gateway Operator</text><text class="ns" x="748" y="219">installs Batch Gateway Operator</text>
    <rect class="card" x="881" y="170" width="218" height="68"/><text class="nt compact" x="990" y="198">Batch Gateway Operator</text><text class="ns" x="990" y="219">controller + CRD</text>
    <rect class="card" x="1257" y="170" width="290" height="68"/><text class="nt" x="1402" y="198">LLMBatchGateway CR</text><text class="ns" x="1402" y="219">created by platform engineer</text>
  </g>
  <path class="red" d="M208 204h23"/><path class="red" d="M415 204h24"/><path class="red" d="M615 204h24"/><path class="red" d="M853 204h24"/><path class="red" d="M1253 204h-149"/>
  <text class="lab" x="1176" y="192" text-anchor="middle">reconciles</text>
  <text class="sm" x="42" y="278">The operator is installed first; only the separate workload CR asks it to create a Batch Gateway instance.</text>
  <text class="sm" x="42" y="298">The platform supplies PostgreSQL, file storage, async transport, Gateway policies, and model routing.</text>

  <rect x="24" y="330" width="1552" height="350" rx="14" fill="#f5f8fc" stroke="#b7c7d9"/>
  <text class="sect" x="42" y="358">Runtime · Batch Gateway workloads use platform-provided routes and services</text>
  <path class="red" d="M990 239v65H800v20"/>
  <text class="lab" x="892" y="296" text-anchor="middle">creates / reconciles owned workloads</text>
  <g text-anchor="middle">
    <rect class="card" x="38" y="428" width="122" height="78"/><text class="nt" x="99" y="460">Client</text><text class="ns" x="99" y="481">JSONL + Batch API</text>
    <rect class="card" x="180" y="428" width="184" height="78"/><text class="nt" x="272" y="455">External Gateway</text><text class="ns" x="272" y="475">optional Batch API route</text><text class="tiny" x="272" y="493">Gateway / policies: platform-owned</text>
    <rect class="card" x="388" y="428" width="170" height="78"/><text class="nt" x="473" y="460">Batch API Server</text><text class="ns" x="473" y="481">/v1/files · /v1/batches</text><text class="tiny" x="473" y="498">operator-owned</text>
    <rect class="card" x="612" y="428" width="176" height="78"/><text class="nt" x="700" y="460">Batch Processor</text><text class="ns" x="700" y="481">claims jobs · joins results</text><text class="tiny" x="700" y="498">operator-owned</text>
    <rect class="card" x="1000" y="428" width="172" height="78"/><text class="nt" x="1086" y="460">Async Processor</text><text class="ns" x="1086" y="481">gates · worker pools</text><text class="tiny" x="1086" y="498">operator-owned</text>
    <rect class="card" x="1190" y="428" width="190" height="78"/><text class="nt compact" x="1285" y="455">Internal Inference Gateway</text><text class="ns" x="1285" y="475">separate per-model HTTPRoute</text><text class="tiny" x="1285" y="493">prepared by the platform</text>
    <rect class="card" x="1400" y="428" width="171" height="78"/><text class="nt" x="1485" y="455">InferencePool + EPP</text><text class="ns" x="1485" y="477">routes to vLLM model pods</text>
  </g>
  <rect x="800" y="407" width="184" height="240" rx="12" fill="#f7f4ff" stroke="#b7a7df" stroke-width="1.4"/>
  <text class="tiny" x="892" y="423" text-anchor="middle">one selected async transport</text>
  <rect class="card" x="813" y="436" width="158" height="58"/><text class="nt compact" x="892" y="461" text-anchor="middle">Async Request Queue</text><text class="ns" x="892" y="480" text-anchor="middle">per-request dispatch</text>
  <rect class="card" x="813" y="545" width="158" height="58"/><text class="nt compact" x="892" y="570" text-anchor="middle">Async Result Queue</text><text class="ns" x="892" y="589" text-anchor="middle">per-request results</text>
  <path class="blue" d="M160 467h16"/><path class="blue" d="M364 467h20"/>
  <path class="purple" d="M788 465h21"/><path class="purple" d="M973 465h23"/>
  <path class="blue" d="M1172 467h14"/><path class="blue" d="M1380 467h16"/>
  <path class="green" d="M1485 425V393H1086V424"/>
  <path class="green" d="M1086 508v65H975"/>
  <path class="green" d="M809 574H700V510"/>
  <text class="lab" x="1285" y="389" text-anchor="middle">inference responses</text>
  <text class="lab" x="754" y="561" text-anchor="middle">collect</text>
  <text class="tiny" x="892" y="625" text-anchor="middle">Redis / Valkey or experimental SQL</text>
  <rect class="card" x="1378" y="548" width="180" height="66"/><text class="nt" x="1468" y="575" text-anchor="middle">Garbage Collector</text><text class="ns" x="1468" y="596" text-anchor="middle">operator-owned · expiry cleanup</text>

  <rect x="24" y="698" width="1552" height="178" rx="14" fill="#f8f9fa" stroke="#c8cdd2"/>
  <text class="sect" x="42" y="727">Backing services</text>
  <g text-anchor="middle">
    <rect class="card" x="353" y="752" width="240" height="94"/><text class="nt" x="473" y="783">PostgreSQL</text><text class="ns" x="473" y="805">metadata + batch-job queue</text><text class="tiny" x="473" y="826">API writes; processor claims/checkpoints</text>
    <rect class="card" x="585" y="752" width="230" height="94"/><text class="nt" x="700" y="783">File Storage</text><text class="ns" x="700" y="805">S3-compatible or filesystem</text><text class="tiny" x="700" y="826">API uploads; processor reads/writes</text>
  </g>
  <path class="blue" d="M473 506V748"/>
  <path class="blue" d="M700 506V748"/>
  <path class="gray" d="M1468 614V858H473V846"/>
  <path class="gray" d="M1500 614V870H700V846"/>
</svg>
